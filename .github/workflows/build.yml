name: Cross-Platform Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    
    strategy:
      matrix:
        # Chạy song song trên cả 3 hệ điều hành phổ biến nhất
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - name: Checkout mã nguồn
      uses: actions/checkout@v4

    - name: Cài đặt môi trường C++ & Chạy CMake
      uses: threeal/cmake-action@v1.3.0
      
    # Tự động cài đặt Qt 6 tương ứng cho từng hệ điều hành
    - name: Cài đặt bộ thư viện Qt 6
      uses: jurplel/install-qt-action@v3
      with:
        version: '6.5.3' # Bản LTS ổn định cao
        modules: 'qtnetwork qtsql'

    - name: Tạo thư mục Build
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release

    - name: Tiến hành Biên dịch (Compile)
      run: cmake --build build --config Release