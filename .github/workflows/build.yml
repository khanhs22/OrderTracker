name: Cross-Platform Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    
    strategy:
      matrix:
        # Chạy song song trên cả 3 hệ điều hành
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - name: Checkout mã nguồn
      uses: actions/checkout@v4

    # BƯỚC 1: Phải cài đặt Qt 6 trước để hệ thống nạp các biến môi trường CMAKE_PREFIX_PATH
    - name: Cài đặt bộ thư viện Qt 6
      uses: jurplel/install-qt-action@v3
      with:
        version: '6.5.3' # Phiên bản LTS cực kỳ ổn định

    # BƯỚC 2: Khi đã có Qt 6, tiến hành cấu hình CMake cấu trúc dự án
    - name: Tạo thư mục Build và Cấu hình CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release

    # BƯỚC 3: Tiến hành Biên dịch ra sản phẩm đóng gói
    - name: Tiến hành Biên dịch (Compile)
      run: cmake --build build --config Release


    # BƯỚC 4: Tạo file nén chứa sản phẩm đóng gói để dễ dàng tải về
    - name: Lưu trữ sản phẩm đóng gói (Artifacts)
      uses: actions/upload-artifact@v4
      with:
        name: OrderTracker-${{ matrix.os }}
        path: build/ # Hoặc đường dẫn đến file thực thi sau khi buildß